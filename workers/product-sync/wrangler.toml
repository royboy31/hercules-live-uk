name = "hercules-product-sync-uk"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV namespace for product data (UK staging)
[[kv_namespaces]]
binding = "PRODUCTS_KV"
id = "50743a0e269f4450b61bb690847534c4"

# R2 bucket for client trust logos
[[r2_buckets]]
binding = "CLIENT_LOGOS_BUCKET"
bucket_name = "hercules-uk-client-logos"

# Scheduled triggers (cron jobs) — disabled to prevent uncontrolled full syncs
# [triggers]
# crons = ["0 3 * * *"]  # Run daily at 3 AM UTC

# Environment variables
[vars]
WC_STORE_URL = "https://staging.hercules-merchandise.co.uk"
ASTRO_SITE_URL = "https://hercules-uk-staging-e9z.pages.dev"

# Development environment
[env.dev]
vars = { WC_STORE_URL = "https://staging.hercules-merchandise.co.uk" }

# Production environment
[env.production]

[[env.production.kv_namespaces]]
binding = "PRODUCTS_KV"
id = "82f827d101734ce38ccc89629c7ae919"

[[env.production.r2_buckets]]
binding = "CLIENT_LOGOS_BUCKET"
bucket_name = "hercules-uk-client-logos"

# BOTH crons must be listed. Cloudflare REPLACES the worker's registered cron list
# on every deploy — it does not append — so naming only one here silently
# unregisters the other.
#   "0 3 * * *"  -> the daily delta sync. scheduled() runs the sync ONLY for a cron
#                   in FULL_SYNC_CRONS (src/index.ts), so it must stay registered
#                   verbatim or the sync becomes unreachable.
#   "* * * * *"  -> the deferred-rebuild flush. Not in FULL_SYNC_CRONS, so it can
#                   never start a sync; normally a single KV read.
# At 03:00 both fire as separate events: the minute one takes the flush branch,
# the daily one syncs once.
# Regression this guards against: 4465365 listed only "* * * * *", which dropped
# the registered "0 3 * * *" and killed the daily sync from 2026-08-05 to 08-08.
# Verify after deploying by reading /status, NOT this file — the repo shows what
# the last deploy set, not what is registered.
[env.production.triggers]
crons = ["* * * * *", "0 3 * * *"]

[env.production.vars]
WC_STORE_URL = "https://hercules-merchandise.co.uk"
ASTRO_SITE_URL = "https://hercules-uk.pages.dev"
