name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'
      target:
        description: 'Deploy target'
        required: false
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.target }}" = "staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
          fi

      - name: Build Astro site (staging)
        if: steps.target.outputs.env == 'staging'
        run: npm run build
        env:
          WORKER_URL: https://hercules-product-sync-uk.gilles-86d.workers.dev
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          IS_STAGING: 'true'
          PUBLIC_IS_STAGING: 'true'

      - name: Build Astro site (production)
        if: steps.target.outputs.env == 'production'
        run: npm run build
        env:
          WORKER_URL: https://hercules-product-sync-uk-production.gilles-86d.workers.dev
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}

      # Fail closed before anything ships. The staging artifact must be unindexable on
      # every host that can serve it, including the raw hercules-uk-staging-e9z.pages.dev
      # alias, which gets none of the hostname-based noindex the custom staging domain
      # has. The inverse gate stops a staging noindex from ever reaching the live site:
      # both targets build from the same source tree.
      - name: Verify artifact indexability
        run: |
          set -u
          target='${{ steps.target.outputs.env }}'
          total=$(find dist -name '*.html' | wc -l | tr -d ' ')
          if [ "$total" -eq 0 ]; then
            echo "::error::dist/ contains no HTML — refusing to deploy"
            exit 1
          fi
          echo "Scanning $total HTML file(s) for target '$target'"

          if [ "$target" = 'staging' ]; then
            missing=$(grep -rLF '<meta name="robots" content="noindex' --include='*.html' dist || true)
            if [ -n "$missing" ]; then
              echo "::error::staging artifact has indexable pages — PUBLIC_IS_STAGING is not reaching the build"
              echo "$missing" | head -20
              exit 1
            fi
            echo "OK: all $total staging page(s) are noindex"
          else
            for p in dist/index.html dist/about/index.html; do
              if [ ! -f "$p" ]; then
                echo "::error::expected production page missing from artifact: $p"
                exit 1
              fi
              if ! grep -qF 'content="index, follow' "$p"; then
                echo "::error::production page is not indexable — a staging noindex reached the production build: $p"
                grep -oE '<meta name="robots"[^>]*>' "$p" || true
                exit 1
              fi
            done
            if grep -qxF 'Disallow: /' dist/robots.txt; then
              echo "::error::production robots.txt carries a site-wide 'Disallow: /'"
              exit 1
            fi
            echo "OK: production artifact is indexable"
          fi

      - name: Deploy Product Sync Worker
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/product-sync/wrangler.toml --env production

      - name: Deploy to Staging
        if: steps.target.outputs.env == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=hercules-uk-staging --branch=main

      - name: Deploy to Production
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=hercules-uk

      - name: Output deployment URL
        run: |
          if [ "${{ steps.target.outputs.env }}" = "production" ]; then
            echo "Deployed to https://hercules-uk.pages.dev (production)"
          else
            echo "Deployed to https://hercules-uk-staging-e9z.pages.dev (staging)"
          fi
